scene.add(new THREE.HemisphereLight(0xcfe5d4,0x27332a,2.0));const sun=new THREE.DirectionalLight(0xffe6bf,3);sun.position.set(-55,90,45);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;scene.add(sun);

// low-detail vegetation and rocky backdrop
for(let i=0;i<55;i++){const x=THREE.MathUtils.randFloat(-61,61),z=THREE.MathUtils.randFloat(-60,60);if(Math.abs(x)<10&&Math.abs(z)<18)continue;const h=THREE.MathUtils.randFloat(1.3,3.8);cube(scene,x,h/2,z,.2,h,.2,M.bark,false);const crown=new THREE.Mesh(new THREE.ConeGeometry(THREE.MathUtils.randFloat(1.2,2.3),h*1.5,7),material(['#344d34','#405a39','#536a45'][i%3]));crown.position.set(x,h+h*.55,z);crown.castShadow=true;scene.add(crown)}
for(let i=0;i<24;i++){let a=i/24*Math.PI*2;let x=Math.cos(a)*105,z=Math.sin(a)*105;let h=THREE.MathUtils.randFloat(25,55);let rock=new THREE.Mesh(new THREE.ConeGeometry(THREE.MathUtils.randFloat(12,24),h,5),material(i%2?'#58685c':'#66766b'));rock.position.set(x,h/2-2,z);rock.rotation.y=a;scene.add(rock)}

// Armoured vehicle props: static training-set dressing only (not drivable).
function makeTank(x,z,rot=0){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
 const hull=material('#465447',.72,.25),edge=material('#2b362d',.6,.45),glass=material('#1c2922',.35,.2);
 cube(g,0,.9,0,4.5,1.25,6.3,hull);cube(g,0,1.55,-.25,2.8,.7,3.1,hull);

 for(const side of [-1,1]){cube(g,side*2.15,.65,0,.35,1.05,6.7,edge);for(let zz=-2.5;zz<=2.5;zz+=.8){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.22,12),edge);wheel.rotation.z=Math.PI/2;wheel.position.set(side*2.28,.55,zz);g.add(wheel)}}

function introTutorial(){
 S.started=false; S.paused=false;
 show(`<div class="card wide"><div class="kicker">MANDATORY ORIENTATION / BEFORE FIRST SORTIE</div><h1>FIRST<br><span style="color:var(--green)">FLIGHT GUIDE</span></h1><p class="lead">Learn the controls and training loop before entering the field. This guide appears on first launch; you can reopen it from the main menu.</p><div class="lessons">
 <div class="lesson"><b>01 / Move</b><p><b>W A S D</b> move · <b>Shift</b> sprint · mouse look. Click inside the 3D world to capture the mouse.</p></div>
 <div class="lesson"><b>02 / Acquire and lock</b><p>Centre the reticle on a drone. Hold aim until the track meter completes, then press <b>E</b> to lock the target and begin the simulated scan.</p></div>
 <div class="lesson"><b>03 / Classify</b><p>After the scan, read the fictional profile and press <b>J</b> for Commercial-style or <b>K</b> for Military-style.</p></div>
 <div class="lesson"><b>04 / Recover and review</b><p>Finish before the timer expires. Correct calls earn points; incorrect calls reduce your score. Press <b>Esc</b> or <b>P</b> to pause.</p></div>
 </div><div class="divider"></div><p class="muted">This is a fictional training simulation. It does not connect to real drones, sensors, radio systems, or weapons.</p><div class="buttons"><button class="primary" id="continueBrief">CONTINUE TO DEFENCE BRIEFING →</button><button id="skipGuide">SKIP TO MENU</button></div></div>`);
 $('continueBrief').onclick=defenceBriefing;
 $('skipGuide').onclick=menu;
}
function defenceBriefing(){
 show(`<div class="card wide"><div class="kicker">OPEN-SOURCE CONTEXT / INDIA</div><h2>Why the training scenarios are changing</h2><p class="lead">Public reporting shows an emphasis on layered counter-UAS awareness, realistic target-system training, swarm preparedness, and operations in difficult terrain. The missions below use these broad themes—not real operational procedures or sensitive tactics.</p>
 <div class="lessons">
 <div class="lesson"><b>Layered counter-UAS training</b><p>India’s Ministry of Defence said in July 2026 that approval was granted for the Army’s AKASH TARANG anti-UAV electronic-warfare system to provide anti-UAV protection. In this game, that inspires an abstract detection-and-coordination level.</p><p><a href="https://www.pib.gov.in/PressReleasePage.aspx?PRID=2280728&lang=1&reg=48" target="_blank" rel="noreferrer">Source: PIB, 3 July 2026</a></p></div>
 <div class="lesson"><b>Drone and counter-drone exercises</b><p>The Army’s VAYU SAMANVAY-II exercise in October 2025 focused on drone/counter-drone operations, integration of aerial and ground assets, and command-and-control coordination.</p><p><a href="https://www.pib.gov.in/PressReleasePage.aspx?PRID=2185226&lang=2&reg=48" target="_blank" rel="noreferrer">Source: PIB, 1 Nov 2025</a></p></div>
 <div class="lesson"><b>Swarm and target-system training</b><p>Reporting in June 2026 described the Army moving to acquire target systems designed to simulate drone swarms, helicopters, and missile-like aerial threats. This inspires the swarm and mixed-contact exercises here.</p><p><a href="https://indianexpress.com/article/india/indian-army-drone-swarm-missile-target-systems-air-defence-training-10753503/" target="_blank" rel="noreferrer">Source: The Indian Express, 23 June 2026</a></p></div>
 <div class="lesson"><b>Mountain and high-altitude readiness</b><p>Recent reporting describes Army interest in drones evaluated for high-altitude conditions. The game represents this only through mountain scenery, visibility changes, and longer observation tasks.</p><p><a href="https://m.economictimes.com/news/defence/indian-army-preparing-for-high-altitude-drone-warfare-orders-225-fpv-drone-capable-of-operating-in-himalyas/articleshow/134786301.cms" target="_blank" rel="noreferrer">Source: Economic Times, Oct 2026</a></p></div>
 </div><div class="divider"></div><p class="muted">These are public, high-level summaries, not official game endorsements. Procurement approval, trials, and reporting do not necessarily mean a system is fielded everywhere.</p><div class="buttons"><button class="primary" id="enterMenu">ENTER TRAINING SYSTEM →</button><button id="reviewTutorial">REVIEW TUTORIAL</button></div></div>`);
 $('enterMenu').onclick=menu;$('reviewTutorial').onclick=introTutorial;
}
function menu(){S.started=false;S.paused=false;document.exitPointerLock?.();$('targetPanel').style.display='none';$('prompt').style.display='none';show(`<div class="card"><div class="kicker">KAZIND / DEFENCE TRAINING SIMULATION</div><h1>DRONE THREAT<br><span style="color:var(--green)">TRAINER 3D</span></h1><p class="lead">A first-person 3D training compound. Move through the environment, track simulated aerial contacts, scan, classify, and review your performance.</p><div class="stats"><div class="stat"><b>${String(LEVELS.length).padStart(2,'0')}</b><small>Progressive levels</small></div><div class="stat"><b>${S.unlocked+1}/${LEVELS.length}</b><small>Current clearance</small></div><div class="stat"><b>${S.best}</b><small>Best score</small></div></div><div class="buttons"><button class="primary" id="start">▶ START TRAINING</button><button id="tutorial">▣ TUTORIAL</button><button id="info">ⓘ INFORMATION</button><button id="select">▦ SELECT LEVEL</button></div><div class="divider"></div><div class="muted">WASD MOVE · SHIFT RUN · CLICK THE SCENE TO CAPTURE MOUSE · ESC PAUSE · SIMULATION ONLY</div></div>`);$('start').onclick=()=>briefing(S.unlocked);$('tutorial').onclick=introTutorial;$('info').onclick=defenceBriefing;$('select').onclick=levelMenu}
function tutorial(){show(`<div class="card wide"><div class="kicker">FIELD GUIDE / TUTORIAL</div><h2>Learn the training loop.</h2><p class="lead">Click the 3D scene after deployment to capture the mouse and look around.</p><div class="lessons"><div class="lesson"><b>01 / Movement</b><p>WASD to move, Shift to sprint. Mouse controls first-person look.</p></div><div class="lesson"><b>02 / Acquire</b><p>Centre the reticle on a drone and hold aim until tracking completes.</p></div><div class="lesson"><b>03 / Scan</b><p>Press E when tracking completes. Keep the target in view.</p></div><div class="lesson"><b>04 / Classify</b><p>Read the fictional profile on screen. J = Commercial; K = Military.</p></div><div class="lesson"><b>05 / Review</b><p>Complete all target classifications before the timer expires.</p></div><div class="lesson"><b>Controls</b><p>WASD move · Shift run · Mouse look · E scan · J/K classify · Esc pause.</p></div></div><div class="buttons"><button class="primary" id="practice">PRACTICE LEVEL 1</button><button id="back">BACK</button></div></div>`);$('practice').onclick=()=>briefing(0);$('back').onclick=menu}
function info(){show(`<div class="card"><div class="kicker">SYSTEM INFORMATION</div><h2>Train judgement in a simulated environment.</h2><p class="lead">KAZIND 3D is a fictional browser training game for observation, tracking, scanning, and classification.</p><div class="divider"></div><p class="muted">• Practise navigation and visual observation.<br>• Follow a consistent scan-and-classify workflow.<br>• Improve decisions under time pressure.<br>• Review score, accuracy, and mistakes after each mission.</p><h3>Fictional profile labels</h3><p class="muted"><b>J — Commercial:</b> consumer-style game profile.<br><b>K — Military:</b> military-style game profile.</p><p class="muted">This game does not connect to real drones, sensors, radio systems, or weapons.</p><div class="buttons"><button class="primary" id="back">BACK TO MENU</button></div></div>`);$('back').onclick=menu}
function levelMenu(){show(`<div class="card wide"><div class="kicker">MISSION SELECT / PROGRESSION</div><h2>Choose your level.</h2><p class="lead">Complete each level to unlock the next.</p><div class="grid">${LEVELS.map((l,i)=>`<div class="level ${i>S.unlocked?'locked':''}"><div class="kicker">LEVEL 0${i+1}</div><b>${l.name}</b><p>${l.desc}</p><button data-level="${i}" ${i>S.unlocked?'disabled':''}>${i<=S.unlocked?'BRIEF':'LOCKED'}</button></div>`).join('')}</div><button id="back">BACK TO MENU</button></div>`);document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>briefing(+b.dataset.level));$('back').onclick=menu}
function briefing(n){S.level=Math.min(n,S.unlocked);const l=LEVELS[S.level];show(`<div class="card"><div class="kicker">MISSION BRIEFING / LEVEL 0${S.level+1}</div><h2>${l.name}</h2><p class="lead">${l.brief}</p><div class="stats"><div class="stat"><b>${l.count}</b><small>Target contacts</small></div><div class="stat"><b>${Math.floor(l.time/60)}:${String(l.time%60).padStart(2,'0')}</b><small>Time limit</small></div><div class="stat"><b>${l.track.toFixed(1)}s</b><small>Tracking time</small></div></div><p class="muted">${l.night?'LOW VISIBILITY CONDITIONS ACTIVE':'STANDARD VISIBILITY CONDITIONS'}</p><div class="buttons"><button class="primary" id="deploy">▶ DEPLOY TO TRAINING AREA</button><button id="back">BACK</button></div></div>`);$('deploy').onclick=()=>startLevel(S.level);$('back').onclick=levelMenu}
function startLevel(n){S.level=n;const l=LEVELS[n];S.score=0;S.time=l.time;S.elapsed=0;S.target=null;S.track=S.scan=0;S.phase='track';S.resolved=S.correct=S.wrong=0;S.started=true;S.paused=false;S.screen='game';S.last=performance.now();player.pos.set(0,1.75,28);S.yaw=0;S.pitch=0;spawn();hide();$('levelLabel').textContent=`LEVEL 0${n+1} / 07`;$('levelName').textContent=l.name;$('levelDesc').textContent=l.desc;$('levelBar').style.width=((n+1)/LEVELS.length*100)+'%';$('targetPanel').style.display='none';toast('MISSION ACTIVE — CLICK THE SCENE TO LOOK AROUND')}
function pause(){if(!S.started)return;S.paused=true;document.exitPointerLock?.();show(`<div class="card" style="max-width:520px"><div class="kicker">SIMULATION PAUSED</div><h2>Mission on hold.</h2><p class="lead">Your timer is paused.</p><div class="buttons"><button class="primary" id="resume">RESUME</button><button id="restart">RESTART LEVEL</button><button id="quit">EXIT TO MENU</button></div></div>`);$('resume').onclick=()=>{S.paused=false;S.screen='game';hide();S.last=performance.now()};$('restart').onclick=()=>startLevel(S.level);$('quit').onclick=menu}
function results(won){S.started=false;document.exitPointerLock?.();if(won)S.unlocked=Math.max(S.unlocked,Math.min(LEVELS.length-1,S.level+1));S.best=Math.max(S.best,S.score);try{localStorage.kazind3dUnlocked=S.unlocked;localStorage.kazind3dBest=S.best}catch{}let pct=S.resolved?Math.round(S.correct/S.resolved*100):0;show(`<div class="card"><div class="kicker">${won?'MISSION COMPLETE':'MISSION ENDED'}</div><h2>${won?'Objective achieved.':'Time expired.'}</h2><p class="lead">${won?'Review the results and continue to the next level.':'Not all targets were classified before time expired. Review and retry.'}</p><div class="stats"><div class="stat"><b>${S.score}</b><small>Mission score</small></div><div class="stat"><b>${pct}%</b><small>Accuracy</small></div><div class="stat"><b>${S.resolved}/${LEVELS[S.level].count}</b><small>Targets resolved</small></div></div><p class="muted">Correct: ${S.correct} · Incorrect: ${S.wrong} · Best score: ${S.best}</p><div class="buttons"><button id="menu">MENU</button><button id="replay">REPLAY</button>${won&&S.level<LEVELS.length-1?'<button class="primary" id="next">NEXT LEVEL →</button>':''}</div></div>`);$('menu').onclick=menu;$('replay').onclick=()=>startLevel(S.level);if($('next'))$('next').onclick=()=>briefing(S.level+1)}
function scan(){if(!S.started||S.paused||!S.target)return;if(S.phase==='ready'){S.phase='scan';S.scan=0;S.target.userData.locked=true;toast('TARGET LOCKED — SIMULATED SCAN STARTED')}else toast(S.phase==='classify'?'SCAN COMPLETE — PRESS J OR K':'TRACK TARGET TO 100% FIRST')}
function classify(kind){if(!S.started||S.paused||S.phase!=='classify'||!S.target)return;let d=S.target;S.resolved++;if(d.userData.kind===kind){S.correct++;S.score+=100+S.level*50;toast('CORRECT CLASSIFICATION +'+(100+S.level*50))}else{S.wrong++;S.score=Math.max(0,S.score-75);toast('INCORRECT CLASSIFICATION −75')}d.userData.alive=false;scene.remove(d);S.target=null;S.track=S.scan=0;S.phase='track';$('targetPanel').style.display='none';if(S.drones.every(d=>!d.userData.alive))results(true)}
document.addEventListener('keydown',e=>{S.keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='Escape'||e.code==='KeyP'){if(S.started&&!S.paused)pause();return}if(e.code==='KeyE')scan();if(e.code==='KeyJ')classify('commercial');if(e.code==='KeyK')classify('military')});document.addEventListener('keyup',e=>S.keys[e.code]=false);$('pause').onclick=()=>{if(S.started&&!S.paused)pause()};
function update(dt){if(!S.started||S.paused||S.screen!=='game')return;const l=LEVELS[S.level];S.time-=dt;S.elapsed+=dt;if(S.time<=0){S.time=0;updateHud();results(false);return}
let f=new THREE.Vector3(-Math.sin(S.yaw),0,-Math.cos(S.yaw)),r=new THREE.Vector3(Math.cos(S.yaw),0,-Math.sin(S.yaw)),mv=new THREE.Vector3();if(S.keys.KeyW||S.keys.ArrowUp)mv.add(f);if(S.keys.KeyS||S.keys.ArrowDown)mv.sub(f);if(S.keys.KeyD||S.keys.ArrowRight)mv.add(r);if(S.keys.KeyA||S.keys.ArrowLeft)mv.sub(r);if(mv.lengthSq()){mv.normalize().multiplyScalar(9*(S.keys.ShiftLeft?1.5:1)*dt);player.pos.add(mv)}player.pos.x=THREE.MathUtils.clamp(player.pos.x,-59,59);player.pos.z=THREE.MathUtils.clamp(player.pos.z,-59,59);camera.position.copy(player.pos);camera.rotation.order='YXZ';camera.rotation.y=S.yaw;camera.rotation.x=S.pitch;
for(const d of S.drones){if(!d.userData.alive)continue;let u=d.userData,dir=u.waypoint.clone().sub(d.position);if(dir.length()<4)u.waypoint.set(THREE.MathUtils.randFloat(-50,50),THREE.MathUtils.randFloat(6,20),THREE.MathUtils.randFloat(-52,50));else{dir.normalize();d.position.addScaledVector(dir,u.speed*dt);d.rotation.y=Math.atan2(dir.x,dir.z);d.rotation.z=Math.sin(S.elapsed*2+u.phase)*.06}d.position.y=THREE.MathUtils.clamp(d.position.y+Math.sin(S.elapsed*2+u.phase)*dt*.8,5,22);d.children.forEach(c=>{if(c.name==='rotor')c.rotation.y+=dt*20;if(c.name==='lockRing'){c.visible=!!d.userData.locked;c.rotation.z+=dt*1.5}})}
ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(S.drones.filter(d=>d.userData.alive),true);let found=null;if(hits.length){let o=hits[0].object;while(o&&!o.userData.kind)o=o.parent;if(o&&o.userData.kind&&hits[0].distance<150)found=o}
if(found){if(S.target!==found){if(S.target&&S.target.userData)S.target.userData.locked=false;S.target=found;S.target.userData.locked=false;S.track=S.scan=0;S.phase='track'}if(S.phase==='track'){S.track+=dt;if(S.track>=l.track){S.track=l.track;S.phase='ready';toast('TARGET ACQUIRED — PRESS E TO SCAN')}}else if(S.phase==='scan'){S.scan+=dt;if(S.scan>=l.scan){S.scan=l.scan;S.phase='classify';toast('SCAN COMPLETE — READ PROFILE')}}}else if(S.phase==='track'){S.track=Math.max(0,S.track-dt*.8);if(S.track===0)S.target=null}else if(S.phase==='ready'){S.target=null;S.track=S.scan=0;S.phase='track'}else if(S.phase==='scan'&&S.target&&S.target.userData.locked){/* E locks the target during the simulated scan. */}
updateHud()}
function updateHud(){$('score').textContent=String(S.score).padStart(4,'0');$('timer').textContent='TIME '+String(Math.floor(S.time/60)).padStart(2,'0')+':'+String(Math.ceil(S.time%60)).padStart(2,'0');$('threats').textContent=S.drones.filter(d=>d.userData.alive).length;$('status').textContent=S.phase==='classify'?'CLASSIFY':S.phase==='scan'?'SCANNING':S.phase==='ready'?'ACQUIRED':'SEARCHING';$('targetPanel').style.display=S.target&&S.started?'block':'none';if(S.target){$('targetName').textContent=S.phase==='classify'?(S.target.userData.kind==='military'?'MILITARY-STYLE PROFILE':'COMMERCIAL-STYLE PROFILE'):'UNKNOWN AIRFRAME';$('trackText').textContent=S.phase==='scan'?`SCAN ${Math.round(S.scan/LEVELS[S.level].scan*100)}%`:`TRACK ${Math.round(S.track/LEVELS[S.level].track*100)}%`;$('trackBar').style.width=(S.phase==='scan'?S.scan/LEVELS[S.level].scan:S.track/LEVELS[S.level].track)*100+'%';$('range').textContent='RANGE '+Math.round(camera.position.distanceTo(S.target.position))+' M';$('targetHint').textContent=S.phase==='track'?'Keep reticle centred on target':S.phase==='ready'?'Press E to start scan':S.phase==='scan'?'Scanning — maintain aim':'Press J Commercial or K Military'}let p=$('prompt');if(S.target&&S.phase==='ready'){p.style.display='block';p.innerHTML='<b class="key">E</b> START SIMULATED SCAN'}else if(S.target&&S.phase==='classify'){p.style.display='block';p.innerHTML='<b class="key">J</b> COMMERCIAL &nbsp; <b class="key">K</b> MILITARY'}else p.style.display='none'}
function animate(now){requestAnimationFrame(animate);let dt=Math.min(.04,(now-S.last)/1000||0);S.last=now;update(dt);const night=S.started&&LEVELS[S.level].night;if(night){scene.background.set('#111c1c');scene.fog.color.set('#111c1c');scene.fog.density=.018;scene.children[0].intensity=.55;sun.intensity=.35}else{scene.background.set('#9aada0');scene.fog.color.set('#9aada0');scene.fog.density=.007;scene.children[0].intensity=2;sun.intensity=3}if(now>S.toastUntil)$('toast').style.display='none';renderer.render(scene,camera)}
introTutorial();requestAnimationFrame(animate);
</script>
